# GitHub Pages yayını.
# Sitenin kendisinde build step yoktur — bu dosya yalnızca repo kökünü
# olduğu gibi Pages'e taşır. Legacy (branch) yayını GitHub tarafında
# kilitlendiği için modern deploy yoluna geçildi.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
